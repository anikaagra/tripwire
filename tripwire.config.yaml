# Tripwire proxy config. 

mode: enforce # off | monitor | enforce

proxy:
  stdio: true
  http:
    port: 8787 # control API (session/intent registration), not MCP transport yet

policyFile: ./tripwire.policy.yaml

upstreams:
  - name: inbox
    entry: apps/mock-servers/inbox/src/index.ts
    # No TRIPWIRE_SCENARIO / TRIPWIRE_PAYLOAD here: upstream env overrides the
    # inherited env, so pinning them would ignore the harness's --scenario and
    # payload. The inbox already defaults to bill-pay / hidden.

  - name: bank
    entry: apps/mock-servers/bank/src/index.ts

approvals:
  # Kept under the MCP SDK's default 60s per-request client timeout, so an
  # "ask" always resolves to allow/block before the calling client gives up
  # on the call first (confirmed by a smoke test: at 60000/60000 the client
  # throws a request-timeout error a beat before the server-side block fires).
  timeoutMs: 45000